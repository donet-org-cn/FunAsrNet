name: Sync public community data

on:
  watch:
    types: [started]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/community-data.yml']
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: community-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Publish public repository and Star data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.github.com/repos/' + process.env.GH_REPOSITORY;
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'User-Agent': 'dotnet-community-data', 'Content-Type': 'application/json' };
          async function api(path, method='GET', body) {
            const response=await fetch(base+path,{method,headers,...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
            const text=await response.text();const data=text?JSON.parse(text):null;
            if(!response.ok)throw Object.assign(new Error('GitHub '+response.status+': '+data?.message),{status:response.status});
            return data;
          }
          const repo=await api('');
          if(repo.private)throw new Error('Community data is only published for public repositories.');
          const users=[];
          for(let page=1;page<=10;page++){
            const batch=await api('/stargazers?per_page=100&page='+page);
            for(const user of batch)users.push({id:user.id,login:user.login});
            if(batch.length<100)break;
          }
          const document={repositoryId:repo.id,owner:repo.owner.login,name:repo.name,repository:repo.html_url,stars:repo.stargazers_count,forks:repo.forks_count,issues:repo.open_issues_count,pushedAt:repo.pushed_at,license:repo.license?.spdx_id||null,users,complete:users.length>=repo.stargazers_count,updatedAt:new Date().toISOString()};
          let ref;try{ref=await api('/git/ref/heads/community-data');}catch(error){if(error.status!==404)throw error;}
          const tree=await api('/git/trees','POST',{tree:[{path:'stargazers.json',mode:'100644',type:'blob',content:JSON.stringify(document)},{path:'README.md',mode:'100644',type:'blob',content:'# Public community data\n\nGenerated by this repository’s GitHub Actions. Contains public repository statistics and public Star usernames and IDs only.\n\nNo credentials, email addresses, or private repository information are included.\n'}]});
          const commit=await api('/git/commits','POST',{message:'Synchronize public community statistics',tree:tree.sha,parents:ref?[ref.object.sha]:[]});
          if(ref)await api('/git/refs/heads/community-data','PATCH',{sha:commit.sha,force:false});
          else await api('/git/refs','POST',{ref:'refs/heads/community-data',sha:commit.sha});
          console.log('Published public Star users:',users.length,'Repository:',repo.full_name);
          NODE
