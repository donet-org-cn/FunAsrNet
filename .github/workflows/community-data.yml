name: Verify community data access
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository-scoped Star access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.github.com/repos/' + process.env.GH_REPOSITORY + '/stargazers?per_page=1', { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'User-Agent': 'dotnet-community-data' } });
          console.log('Repository-scoped access status:', response.status);
          if (!response.ok) { console.log((await response.json()).message); process.exit(1); }
          console.log('Public Star users available:', (await response.json()).length);
          NODE
